<canvas id="scene" aria-label="Roadster 3D 飞行游戏"></canvas>
<header><div class="logo">ROADSTER <small>飞跃挑战</small></div><div class="tools"><button class="icon" id="sound" aria-label="关闭声音" title="声音">♪</button><button class="icon" id="pause" aria-label="暂停游戏" title="暂停">Ⅱ</button></div></header>
<div id="hud"><div class="distance"><span id="distance">0.0</span><small>m</small></div><div class="fuelrow"><div class="fueltrack"><div class="fuelbar" id="fuelBar"></div></div><span id="fuelLabel">100%</span></div><div id="altitude">U 形跳台 · 固定燃料</div></div>
<aside id="rankPanel"><div class="rankhead">全球排行榜 <span>● LIVE</span></div><div id="rankRows"><div class="rankempty">正在连接全球榜…</div></div><button class="textbutton" id="openBoard">查看全部 ↗</button><div id="rankStatus">云端实时成绩</div></aside>
<div id="attitudeStick" class="stick" role="slider" tabindex="0" aria-label="姿态摇杆：左右翻滚，上下俯仰" aria-valuemin="-100" aria-valuemax="100" aria-valuenow="0"><span class="stick-marker up">抬头</span><span class="stick-marker left">⟲</span><span class="stick-marker right">⟳</span><div class="knob"></div><div class="stick-label">姿态 · 俯仰 / 翻滚</div></div>
<div id="thrustStick" class="stick" role="slider" tabindex="0" aria-label="喷气摇杆：向上推动增加喷气" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span class="stick-marker up">喷气 ↑</span><div class="knob"></div><div class="stick-label">向上推 · 喷气</div></div>
<div id="hint">左杆调整姿态 · 右杆上推喷气<br>起飞后先压低车头，再加推力</div>
<section id="entry"><h2 id="resultTitle">飞得更远。</h2><p id="resultDetail">冲上 U 形跳台，在空中自由翻转。</p><form id="startForm"><input id="player" aria-label="驾驶员名称" placeholder="驾驶员名称" maxlength="16" required autocomplete="nickname"><button class="primary" id="startButton">起飞 ↗</button></form><div id="message" role="status"></div><div id="uploadStatus" hidden></div><button id="retry" hidden>重新上传</button><div class="privacy">联网后名称与最佳成绩将同步到全球榜</div></section>
<div id="resumeOverlay" hidden><button id="resume">继续飞行 ↗</button></div><span id="modelStatus"></span>
<dialog id="board"><button class="close" id="closeBoard" aria-label="关闭全球排行榜">×</button><h2>全球排行榜</h2><p style="font-size:10px;color:#7f91ac">每位驾驶员的最佳成绩 · 起点至落点的地面直线距离</p><div id="boardContent"></div></dialog>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script><script type="module" src="game.js"></script></body></html>
